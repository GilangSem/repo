<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selamat Datang</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 50px 40px;
        max-width: 450px;
        width: 100%;
        text-align: center;
        animation: fadeIn 0.6s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 50%;
        margin: 0 auto 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
      }

      h1 {
        color: #333;
        font-size: 28px;
        margin-bottom: 10px;
        font-weight: 600;
      }

      p {
        color: #666;
        margin-bottom: 30px;
        font-size: 16px;
        line-height: 1.6;
      }

      .form-group {
        margin-bottom: 25px;
        text-align: left;
      }

      label {
        display: block;
        color: #555;
        font-weight: 500;
        margin-bottom: 8px;
        font-size: 14px;
      }

      input[type="text"] {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
        transition: all 0.3s ease;
        outline: none;
      }

      input[type="text"]:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      .result {
        margin-top: 25px;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 10px;
        display: none;
      }

      .result.show {
        display: block;
        animation: fadeIn 0.4s ease-in;
      }

      .result h3 {
        color: #667eea;
        margin-bottom: 10px;
      }

      .result p {
        color: #333;
        margin: 0;
        font-size: 18px;
        font-weight: 500;
      }

      @media (max-width: 480px) {
        .container {
          padding: 40px 25px;
        }

        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">ðŸ‘‹</div>
      <h1>Halo, Selamat Datang!</h1>
      <p>Silakan masukkan nama Anda untuk melanjutkan</p>

      <form id="nameForm">
        <div class="form-group">
          <label for="userName">Nama Lengkap</label>
          <input
            type="text"
            id="userName"
            placeholder="Masukkan nama Anda..."
            required
          />
        </div>
        <button type="submit">Kirim</button>
      </form>

      <div class="result" id="result">
        <h3>Terima Kasih!</h3>
        <p id="greeting"></p>
      </div>
    </div>

    <script>
      document
        .getElementById("nameForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const name = document.getElementById("userName").value;
          const resultDiv = document.getElementById("result");
          const greeting = document.getElementById("greeting");

          greeting.textContent = `Senang bertemu dengan Anda, ${name}!`;
          resultDiv.classList.add("show");
        });
    </script>
  </body>
</html>
