<!doctype html>
<html>
  <head>
    <title>Terminal</title>
  </head>
  <body
    style="
      margin: 0;
      background: #000;
      color: #0f0;
      font-family: monospace;
      display: grid;
      place-items: center;
      height: 100vh;
    "
  >
    <style>
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(0deg, #0f02 0 2px, #0000 2px 4px);
        pointer-events: none;
      }
      .t {
        border: 1px solid #0f0;
        padding: 2rem;
        box-shadow:
          0 0 20px #0f0,
          inset 0 0 20px #0f03;
        width: 80%;
        max-width: 500px;
      }
      h1 {
        margin: 0 0 1rem;
        text-shadow: 0 0 10px #0f0;
        letter-spacing: 2px;
      }
      input {
        background: 0;
        border: none;
        border-bottom: 1px solid #0f0;
        color: #0f0;
        font: inherit;
        width: 100%;
        padding: 0.5rem 0;
        outline: none;
      }
      button {
        margin-top: 1.5rem;
        background: #0f0;
        color: #000;
        border: none;
        padding: 0.5rem 1.5rem;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 10px #0f0;
      }
      button:hover {
        background: #000;
        color: #0f0;
        box-shadow: 0 0 20px #0f0;
      }
      #o {
        margin-top: 1rem;
        min-height: 1.5rem;
        text-shadow: 0 0 5px #0f0;
      }
      @keyframes b {
        50% {
          opacity: 0;
        }
      }
      .c::after {
        content: "_";
        animation: b 1s infinite;
      }
    </style>
    <div class="t">
      <h1>> SYSTEM_ACCESS</h1>
      <form
        onsubmit="
          event.preventDefault();
          o.innerHTML = '> AUTH...<br>> WELCOME, ' + n.value.toUpperCase();
          o.className = 'c';
        "
      >
        <input
          id="n"
          placeholder="ENTER_USERNAME"
          required
          autocomplete="off"
        />
        <button type="submit">[ EXECUTE ]</button>
      </form>
      <div id="o" class="c"></div>
    </div>
  </body>
</html>
